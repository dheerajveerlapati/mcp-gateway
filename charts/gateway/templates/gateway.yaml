# The gateway: dashboard API, the /mcp endpoint and the chat agent.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  # With autoscaling on, the HorizontalPodAutoscaler owns the count (hpa.yaml);
  # setting it here too would reset it on every helm upgrade.
  replicas: {{ .Values.gateway.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
        app.kubernetes.io/name: gateway
      annotations:
        # For a Prometheus in the cluster; /metrics is not routed by the Ingress.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      {{- if .Values.hosted.enabled }}
      # Talks to the Kubernetes API only to run hosted MCP servers (Role in hosted.yaml).
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false # never talks to the Kubernetes API
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      # Apply database migrations before the app starts. Replicas starting at
      # the same time take turns via a Postgres lock (see migrations/env.py).
      initContainers:
        - name: migrate
          image: {{ include "gateway.imageRef" (list .Values.gateway.image .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: [alembic, upgrade, head]
          env:
            {{- include "gateway.env" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      containers:
        - name: gateway
          image: {{ include "gateway.imageRef" (list .Values.gateway.image .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          env:
            {{- include "gateway.env" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - name: http
              containerPort: 8000
          # Ready = the database answers. Alive = the process answers.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
