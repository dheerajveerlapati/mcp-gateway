# One public host for everything people use:
#   /mcp  -> gateway (MCP clients and the chat agent)
#   /api  -> gateway (dashboard API)
#   /     -> dashboard (the React pages)
# Same host for the API and the pages means no CORS, and the login cookie
# stays first-party.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.host }}]
      secretName: {{ .Release.Name }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}
                port: { name: http }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-dashboard
                port: { name: http }
