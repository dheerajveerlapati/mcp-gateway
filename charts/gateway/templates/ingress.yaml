# One public host for everything people use:
#   /mcp  -> gateway (MCP clients and the chat agent)
#   /api  -> gateway (dashboard API)
#   /.well-known, /oauth -> gateway (OAuth login for MCP clients)
#   /     -> dashboard (the React pages, incl. the /authorize-app consent page)
# Same host for the API and the pages means no CORS, and the login cookie
# stays first-party.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.host }}]
      secretName: {{ .Release.Name }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          # Prefix, not Exact: Traefik ranks rules by their length, and
          # "Path(`/mcp`)" is shorter than the dashboard's "PathPrefix(`/`)",
          # so an Exact rule would lose and /mcp would go to the dashboard.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { name: http }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { name: http }
          # OAuth login for MCP clients: discovery documents and endpoints.
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { name: http }
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-dashboard
                port: { name: http }
