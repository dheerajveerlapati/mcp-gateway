# Postgres: the gateway's own database (users, keys, servers, audit log).
# Separate from the store's MariaDB, so the two fail and upgrade independently.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None # headless: DNS points straight at the database pod
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image can run directly as its "postgres" user (999).
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - { name: POSTGRES_USER, value: gateway }
            - { name: POSTGRES_DB, value: gateway }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: db-password }
            # A sub-directory, because initdb wants an empty directory.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec: { command: [pg_isready, -U, gateway] }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec: { command: [pg_isready, -U, gateway] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: [pg_isready, -U, gateway] }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
