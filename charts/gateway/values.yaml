# Defaults for the gateway chart. values-local.yaml / values-prod.yaml only
# override what differs per environment.

# Public hostname of the dashboard. The MCP endpoint is https://<host>/mcp.
host: dashboard.localtest.me

ingress:
  className: traefik
  tls:
    enabled: false
    clusterIssuer: "" # cert-manager ClusterIssuer when TLS is on (prod)

# Secret with the gateway's secrets. Created by scripts/secrets.sh, never by
# this chart. Keys: db-password, session-secret, encryption-key,
# admin-password, woo-mcp-token
existingSecret: gateway-secrets

gateway:
  image:
    registry: "" # "" = built locally and imported into k3d; prod: ghcr.io/<owner>
    repository: gateway
    tag: "" # "" = chart appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  # The first admin, created on first start (password from the Secret).
  bootstrapAdminEmail: admin@example.com
  # Registered automatically as the first upstream server.
  wooMcpUrl: http://woo-mcp.mcp:8000/mcp
  upstreamTimeoutSeconds: 15
  healthIntervalSeconds: 10
  # Time zone the chat agent uses for "today".
  timezone: Asia/Kolkata
  # SSRF guard: in-cluster hosts admins may register. Any other server URL
  # must resolve to a public address.
  allowedInternalHosts: ["*.mcp", "*.mcp.svc.cluster.local", "*.mcp-hosted", "*.mcp-hosted.svc.cluster.local"]
  # Tool calls per user per minute (shared across replicas: counted in Postgres).
  rateLimitPerMinute: 60
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

# Chat agent model. The API key lives in its own Secret, created by hand:
#   kubectl -n gateway create secret generic llm-secrets --from-literal=api-key=...
# Without it everything works except the chat, which says it is not configured.
# To use Gemini instead: provider google_genai, model gemini-3.5-flash.
llm:
  provider: groq
  model: openai/gpt-oss-120b
  existingSecret: llm-secrets

# Hosted MCP servers: admins add a server by container image and the gateway
# runs it in this namespace, with its own Secret, limits and NetworkPolicy.
hosted:
  enabled: true
  namespace: mcp-hosted
  # Limits for all hosted servers together.
  quota:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 4Gi
  # Where the gateway reaches the Kubernetes API. k3s defaults: the
  # "kubernetes" Service IP on 443, which forwards to the API server on 6443.
  apiServerEgress:
    - { cidr: 10.43.0.1/32, port: 443 }
    - { cidr: 0.0.0.0/0, port: 6443 }

dashboard:
  image:
    registry: ""
    repository: dashboard
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

postgres:
  image: postgres:17.11
  storage:
    size: 1Gi
    storageClass: "" # "" = cluster default (local-path on k3d and k3s)
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system
  # Namespace of the in-cluster MCP servers the gateway may call.
  mcpNamespace: mcp
