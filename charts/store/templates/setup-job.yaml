# Scripts for the setup Job, taken from charts/store/files/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-setup
  labels:
    {{- include "store.labels" . | nindent 4 }}
data:
  setup.sh: |
    {{- .Files.Get "files/setup.sh" | nindent 4 }}
  api-key.php: |
    {{- .Files.Get "files/api-key.php" | nindent 4 }}
---
# Configures WooCommerce with WP-CLI after every install and upgrade.
# As a Helm hook it runs once WordPress is up, and Helm waits for it to finish.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-setup
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: store-setup
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/name: store-setup
    spec:
      restartPolicy: Never
      securityContext:
        # Same user as Apache in the WordPress image, so files stay writable by both.
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
      # The site volume is ReadWriteOnce: run on the same node as WordPress.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/name: wordpress
      containers:
        - name: setup
          image: {{ .Values.setup.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          command: [sh, /setup/setup.sh]
          workingDir: /var/www/html
          env:
            {{- include "store.dbEnv" . | nindent 12 }}
            - { name: HOME, value: /tmp } # wp-cli needs a writable home for its cache
            - { name: SITE_URL, value: {{ include "store.siteUrl" . | quote }} }
            - { name: SITE_TITLE, value: {{ .Values.setup.siteTitle | quote }} }
            - { name: ADMIN_USER, value: {{ .Values.setup.adminUser | quote }} }
            - { name: ADMIN_EMAIL, value: {{ .Values.setup.adminEmail | quote }} }
            - { name: CURRENCY, value: {{ .Values.setup.currency | quote }} }
            - { name: WOO_VERSION, value: {{ .Values.setup.woocommerceVersion | quote }} }
            - { name: STOREFRONT_VERSION, value: {{ .Values.setup.storefrontVersion | quote }} }
            - { name: SAMPLE_PRODUCTS, value: {{ .Values.setup.sampleProducts | quote }} }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: wp-admin-password }
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: woo-consumer-key }
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: woo-consumer-secret }
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
          volumeMounts:
            - name: site
              mountPath: /var/www/html
            - name: scripts
              mountPath: /setup
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-setup
