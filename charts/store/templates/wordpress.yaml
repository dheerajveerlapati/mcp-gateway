# WordPress + WooCommerce. All site files (core, plugins, themes, uploads)
# live on one PVC, so plugin installs and product images survive restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: wordpress
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.wordpress.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.wordpress.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: wordpress
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: wordpress
spec:
  replicas: 1
  # The volume is ReadWriteOnce, so the old pod must stop before the new one
  # mounts it. (Scaling WordPress out would need shared storage - see docs.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: wordpress
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/name: wordpress
    spec:
      automountServiceAccountToken: false
      securityContext:
        # Run Apache/PHP as www-data (33), not root. Binding port 80 normally
        # needs root; this namespaced, "safe" sysctl lets this pod's
        # unprivileged user bind it instead.
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile: { type: RuntimeDefault }
        sysctls:
          - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
      initContainers:
        # A new local-path volume is owned by root, and www-data could not copy
        # WordPress into it on first start. Hand this one directory (not
        # recursively) to www-data. Root, but with only the CHOWN capability.
        - name: volume-owner
          image: {{ .Values.wordpress.image }}
          command: [chown, "33:33", /var/www/html]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
          volumeMounts:
            - name: site
              mountPath: /var/www/html
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            {{- include "store.dbEnv" . | nindent 12 }}
            # Behind the ingress, TLS ends at Traefik. Trust the forwarded scheme
            # so WordPress builds https:// links instead of redirect-looping.
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                if (($_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $_SERVER['HTTPS'] = 'on'; }
          ports:
            - name: http
              containerPort: 80
          # First start copies WordPress into the empty volume; allow ~2 minutes.
          startupProbe:
            httpGet: { path: /wp-includes/images/blank.gif, port: http }
            periodSeconds: 5
            failureThreshold: 24
          # Ready = PHP runs and the database answers (a DB error returns 500).
          readinessProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          # Alive = Apache answers. Deliberately not tied to the database, so a
          # database outage does not cause WordPress restarts on top of it.
          livenessProbe:
            httpGet: { path: /wp-includes/images/blank.gif, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: site
              mountPath: /var/www/html
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress
