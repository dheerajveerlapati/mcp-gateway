# Serves the built dashboard (static files). The API and /mcp are routed to
# the gateway by the Ingress, so nginx only ever serves files.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Basic browser hardening.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Caching uses `expires`, not add_header: an add_header inside a location
    # would silently drop the security headers above.

    # Built files have a content hash in their name, so they can be cached forever.
    location /assets/ {
        expires max;
    }

    # Single-page app: unknown paths (e.g. /invite/abc) get index.html.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
