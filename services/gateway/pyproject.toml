[project]
name = "gateway"
version = "0.1.0"
description = "Team MCP gateway: dashboard API, MCP aggregator and chat agent"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "deepagents==0.7.23",
    "email-validator==2.3.0",
    "fastapi==0.143.0",
    "langchain-google-genai==4.4.1",
    "mcp==2.3.0",
    "pyjwt==2.15.1",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[tool.alembic]
script_location = "migrations"
prepend_sys_path = ["."]
